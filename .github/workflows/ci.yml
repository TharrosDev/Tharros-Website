name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint first: it enforces the React Compiler rules, which the build does
      # not, and it fails in seconds rather than after a full compile.
      - run: npm run lint

      - run: npm run build
